<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & touch icon -->
    <link rel="icon" type="image/png" href="/aurora-favicom.png" />
    <link rel="apple-touch-icon" href="/aurora-logo.png" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA: barra de navegación del color de la app -->
    <meta name="theme-color" content="#0d1a26" />

    <!-- PWA: comportamiento instalable en iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurora" />

    <title>Aurora</title>

    <!-- SEO / previsualización al compartir el enlace. La landing pública ("/"
         para visitantes sin sesión) es lo único indexable de la app: el resto
         vive detrás del login. -->
    <meta
      name="description"
      content="Aurora es el sistema de gestión para fincas: programa las labores de cada lote, controla la bodega, liquida la planilla y muestra cuánto costó producir."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aurora" />
    <meta property="og:title" content="Aurora — Software de gestión para fincas" />
    <meta
      property="og:description"
      content="Programa las labores de cada lote, controla la bodega, liquida la planilla y mira el costo por lote. Un solo sistema para el campo y la oficina."
    />
    <meta property="og:url" content="https://aurora.comunplace.com/" />
    <meta property="og:image" content="https://aurora.comunplace.com/aurora-logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Apply persisted theme before paint to avoid flash-of-wrong-theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aurora_theme');
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
